# DeepSeek Harness (IP:8787) + dsh.saisqi.xyz (HTTPS) + /qqadmin + /status
map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8787;
    server_name _;

    client_max_body_size 200m;
    access_log /www/wwwlogs/dsh.access.log;
    error_log  /www/wwwlogs/dsh.error.log;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_flags ~ samesite=lax;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name dsh.saisqi.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/dsh.saisqi.xyz;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dsh.saisqi.xyz;

    ssl_certificate     /www/server/panel/vhost/cert/dsh.saisqi.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/dsh.saisqi.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DSHSSL:10m;

    access_log /www/wwwlogs/dsh.access.log;
    error_log  /www/wwwlogs/dsh.error.log;

    client_max_body_size 200m;

    location = /status { return 301 /status/; }

    location /status/ {
        proxy_pass http://127.0.0.1:8097/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location = /qqadmin { return 301 /qqadmin/; }

    location /qqadmin/ {
        return 301 https://$host/status/;
    }



    # ===== 手机设备控制台（AI 添加 2026-11-06）=====
    location = /dev-8f3a2c7d1e {
        alias /www/wwwroot/device/index.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }
    location = /dev-8f3a2c7d1e/api {
        proxy_pass http://127.0.0.1:18090/admin/device;
        proxy_set_header Host 127.0.0.1;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }


    # ===== DSH 手机端中转（AI 添加 2026-11-06）=====
    # /dsh/ → SSH 反向隧道 → 手机 127.0.0.1:3080（主实例，直接复用，不重启）
    # 手机端只监听 127.0.0.1，且 /api 有 browser-trust 栅栏（校验 Host/Origin），
    # 所以这里把 Host/Origin 改写成手机侧自己的 authority，token cookie 的 authority 也是它。
    location /dsh/ {
        proxy_pass http://127.0.0.1:18090/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3080;
        proxy_set_header Origin http://127.0.0.1:3080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 200m;
    }

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_flags ~ samesite=lax;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name dsh.saisqi.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/dsh.saisqi.xyz;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
